name: Trigger Website Update

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  trigger-website-update:
    # Upstream publishing integrations are not enabled in forks.
    if: github.repository == 'electerm/electerm'
    runs-on: ubuntu-latest
    environment: build
    strategy:
      matrix:
        repository:
          - electerm/electerm.org
          - electerm/repos
          - electerm/history.electerm.org
    steps:
      - name: Trigger ${{ matrix.repository }} repository workflow
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.PAT_REPO_TOKEN }}
          repository: ${{ matrix.repository }}
          event-type: electerm-release